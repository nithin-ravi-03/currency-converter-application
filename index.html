<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #2d3748;
        }

        nav {
            background: rgba(255, 255, 255, 0.95);
            padding: 1rem 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 4px solid #764ba2;
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #764ba2;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo i {
            color: #667eea;
            font-size: 1.8rem;
        }

        nav ul {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        nav ul li a {
            text-decoration: none;
            color: #4a5568;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
        }

        nav ul li a:hover {
            color: #764ba2;
            background: rgba(118, 75, 162, 0.1);
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 2rem;
        }

        .converter-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 1.5rem;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            color: #764ba2;
            font-size: 2.2rem;
            margin-bottom: 2rem;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        form {
            display: grid;
            gap: 1.5rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 1.1rem;
            color: #667eea;
            font-weight: 600;
        }

        input[type="number"],
        select {
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
            background: white;
        }

        input[type="number"]:focus,
        select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .output {
            margin-top: 2rem;
            display: none;
        }

        .output h2 {
            color: #764ba2;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: white;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 1.2rem;
            text-align: left;
        }

        th {
            background: #667eea;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        tr:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: white;
            font-size: 0.9rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .loading {
            display: none;
            justify-content: center;
            margin: 2rem 0;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #764ba2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Glassmorphism effects */
        .glass {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-content {
                flex-direction: column;
                gap: 1rem;
            }

            nav ul {
                gap: 1rem;
            }

            .container {
                padding: 1rem;
            }

            .converter-card {
                padding: 1.5rem;
            }

            table {
                display: block;
                overflow-x: auto;
            }

            h1 {
                font-size: 1.8rem;
            }

            .btn {
                padding: 0.8rem 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-content">
            <div class="logo">
                <i class="fas fa-coins"></i>
                MyCurrencyConverter
            </div>
            <ul>
                <li><a href="/"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="/about"><i class="fas fa-info-circle"></i> About</a></li>
                <li><a href="/contact"><i class="fas fa-envelope"></i> Contact</a></li>
            </ul>
        </div>
    </nav>
    
    <div class="container">
        <div class="converter-card">
            <h1><i class="fas fa-exchange-alt"></i> Currency Converter</h1>
            <form>
                <div class="form-group">
                    <label for="quantity"><i class="fas fa-money-bill-wave"></i> Amount</label>
                    <input type="number" name="quantity" min="1" max="10000" placeholder="Enter amount">
                </div>
                <div class="form-group">
                    <label for="currency"><i class="fas fa-globe"></i> From Currency</label>
                    <select name="currency">
                        <option value="INR">Indian Rupee (INR)</option>
                        <option value="USD">US Dollar (USD)</option>
                        <option value="EUR">Euro (EUR)</option>
                    </select>
                </div>
                <button class="btn" type="submit">
                    <i class="fas fa-sync-alt"></i>
                    Convert Now
                </button>
            </form>

            <div class="loading">
                <div class="loading-spinner"></div>
            </div>

            <div class="output">
                <h2><i class="fas fa-chart-line"></i> Converted Values</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Currency</th>
                            <th>Code</th>
                            <th>Value</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer>
        Copyright © 2024 MyCurrencyConverter. All rights reserved.
    </footer>

    <script>
        console.log("Script.js working")

        const populate = async (value, currency) => {
            const loading = document.querySelector(".loading");
            const output = document.querySelector(".output");
            
            loading.style.display = "flex";
            output.style.display = "none";
            
            let myStr = ""
            const apiKey = "cur_live_9APIzitHrmYJAHXaOt8r8Tl2V0qxeZtqSSWGhimC"
            const url = `https://api.currencyapi.com/v3/latest?apikey=${apiKey}&base_currency=${currency}`
            
            try {
                const response = await fetch(url)
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`)
                }
                
                const rJson = await response.json()
                
                if (!rJson.data) {
                    throw new Error('No data received from API')
                }
                
                for (let key of Object.keys(rJson.data)) {
                    myStr += `
                        <tr>
                            <td>${key}</td>
                            <td>${rJson.data[key].code}</td>
                            <td>${Math.round(rJson.data[key].value * value)}</td>
                        </tr>
                    `
                }
                
                const tableBody = document.querySelector("tbody");
                tableBody.innerHTML = myStr;
                
                loading.style.display = "none";
                output.style.display = "block";
            } catch (error) {
                console.error("Error fetching currency data:", error);
                const tableBody = document.querySelector("tbody");
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="3" style="color: #e53e3e; text-align: center; padding: 2rem;">
                            <i class="fas fa-exclamation-circle" style="font-size: 2rem; margin-bottom: 1rem;"></i><br>
                            Error loading currency data. Please check your API key and try again.
                        </td>
                    </tr>
                `;
                loading.style.display = "none";
                output.style.display = "block";
            }
        }

        const btn = document.querySelector(".btn")
        btn.addEventListener("click", (e) => {
            e.preventDefault()
            const value = parseInt(document.querySelector("input[name='quantity']").value);
            const currency = document.querySelector("select[name='currency']").value
            populate(value, currency)
        })

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelector(".output").style.display = "none";
            document.querySelector(".loading").style.display = "none";
        })
    </script>
</body>
</html>
